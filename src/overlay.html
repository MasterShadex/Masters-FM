  // ── Progress bar ────────────────────────────────────────────────────────
  // Only toggle hidden-by-config, not the normal hide-when-no-duration logic
  const timebar = document.getElementById('time-bar');
  timebar._progressEnabled = cfg.progressBar.enabled;
  R.setProperty('--progress-h',        cfg.progressBar.height     + 'px');
  R.setProperty('--progress-radius',   (cfg.progressBar.borderRadius ?? 6) + 'px');
  R.setProperty('--progress-track',    cfg.progressBar.trackColor);
  const fc = cfg.progressBar.fillColors;
  R.setProperty('--progress-fill-a',   fc[0] || '#8020c0');
  R.setProperty('--progress-fill-b',   fc[1] || fc[0] || '#ff60c8');
  R.setProperty('--progress-fill-c',   fc[2] || fc[1] || fc[0] || '#c040ff');

  // ── Timestamps ──────────────────────────────────────────────────────────
  R.setProperty('--ts-font-size', cfg.timestamps.fontSize + 'px');
  R.setProperty('--ts-color',     cfg.timestamps.color);
  R.setProperty('--ts-text-shadow',
    _glowCss(cfg.timestamps.glowEnabled, cfg.timestamps.glowColor || '#e090ff', cfg.timestamps.glowSize ?? 6));

  // ── Show/hide animation ──────────────────────────────────────────────────
  // All three vars are set as inline style on #widget itself — CSS vars used inside
  // `transition` and `transform` must be on the element, not <html>, to take effect.
  const animDir  = cfg.showAnimation.direction || 'up';
  const animDist = cfg.showAnimation.slideDistance + 'px';
  const dur      = cfg.showAnimation.duration + 's';

  // "Slide Up"    = card enters FROM above (top), travels downward into position → start offset is negative Y
  // "Slide Down"  = card enters FROM below (bottom), travels upward into position → start offset is positive Y
  // "Slide Left"  = card enters FROM the left, travels rightward into position → start offset is negative X
  // "Slide Right" = card enters FROM the right, travels leftward into position → start offset is positive X
  const dirTransform = {
    up:    `translateY(-${animDist})`,
    down:  `translateY(${animDist})`,
    left:  `translateX(-${animDist})`,
    right: `translateX(${animDist})`,
  };
  const easingMap = {
    // Each curve is ~20% more aggressive — overshoot and undershoot amplified
    // so the motion "reads" clearly to viewers watching an OBS scene. Spring
    // arrives past the settle point then pulls in; bounce digs deeper under
    // the start and rebounds higher at the end; ease punchier in/out.
    spring: 'cubic-bezier(0.34,1.85,0.64,1)',    // overshoot spring (1.56 → 1.85)
    ease:   'cubic-bezier(0.30,0.55,0.40,1.00)', // snappier smooth ease-out
    bounce: 'cubic-bezier(0.68,-0.80,0.27,1.85)',// deeper back + bigger overshoot
    linear: 'linear',
  };
  const easing    = easingMap[cfg.showAnimation.easing || 'spring'] || easingMap.spring;
  const slideFrom = dirTransform[animDir] || dirTransform.up;

  // Set directly on the widget element so they're guaranteed to take effect
  widgetEl.style.setProperty('--slide-transform', slideFrom);
  widgetEl.style.transition = `opacity ${dur} ease, transform ${dur} ${easing}`;

  // ── Dynamic CSS: glow keyframes + conic border gradient ──────────────────
  document.getElementById('_dyn').textContent = buildDynCss(cfg);

  // ── v7.0.0 layout mode: apply absolute-position rules per node ───────────
  applyLayoutMode(cfg);

  // ── Dynamic palette: re-apply AFTER config vars are set ──────────────────
  // This ensures sub-toggle changes take effect immediately without waiting for
  // a new art load. applyDynamicPalette overrides specific config vars above.
  if (cfg.dynamicColors?.enabled && _lastPalette) {
    applyDynamicPalette(_lastPalette);
    overlayLog('INFO', 'DynColors: re-applied after config change');
  } else if (cfg.dynamicColors?.enabled && !_lastPalette) {
    // Palette not yet cached (dynamic colors just enabled, or first load).
    // Pull current art via /art proxy and extract immediately.
    const _cfgPalTmp = new Image();
    _cfgPalTmp.crossOrigin = 'anonymous';
    _cfgPalTmp.onload = () => {
      const palette = extractPalette(_cfgPalTmp);
      if (palette) { _lastPalette = palette; applyDynamicPalette(palette); overlayLog('INFO', 'DynColors: palette extracted on config enable'); }
    };
    _cfgPalTmp.src = `/art?t=${Date.now()}`;
  }
}

// Preview mode: when loaded with ?preview=1 (inside the /customize iframe),
// the server pushes changes via SSE (`event: preview-config`) so polling is
// only a fallback for cases where SSE dropped. Normal mode: SSE push covers
// saves too (`event: overlay-config`). Either way the poll fallback stays
// infrequent so CPU stays low.
const _IS_PREVIEW  = new URLSearchParams(location.search).get('preview') === '1';
const _CFG_URL     = _IS_PREVIEW ? '/preview-config' : '/overlay-config';
// 5 s reconciliation poll (both modes) — SSE is the primary path; poll just
// catches missed packets. Preview used to poll every 500 ms; that was burning
// CPU for no benefit now that SSE push is in place.
const _CFG_INTERVAL = 5000;

let _cfgTimer = null;
async function loadConfig() {
  try {
    const d = await fetch(_CFG_URL).then(r => r.json());
    const s = JSON.stringify(d);
    if (s !== _lastCfgStr) {
      _lastCfgStr = s;
      applyConfig(d);
    }
  } catch { /* server down — keep current config */ }
}

// Load immediately, then poll at the interval appropriate for this mode.
loadConfig();
_cfgTimer = setInterval(loadConfig, _CFG_INTERVAL);


// ══════════════════════════════════════════════════════════════════════════
//  TRACK DISPLAY
// ══════════════════════════════════════════════════════════════════════════

let lastTrack = null, lastArt = '', timer = null;
// Frozen elapsed captured the INSTANT isPaused flips true. Survives subsequent
// ticks so the progress bar + timestamp stay rock-steady even if the server
// briefly sends isPaused=true without pausedAt (race between tray webhook and
// server's transition-handling pin). Reset to null on resume.
let frozenElapsed = null;
// Pause debounce: wait 1s before freezing the timer so the 1-second sync tick
// always gets a chance to correct the position before we lock it in place.
let _pauseDebounce = null;

const fmt = ms => {
  if (!ms || ms < 0) return '0:00';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

// tick() is called both on interval AND on every rAF (from drawSpectrum).
// Cache last-painted values so we skip DOM writes when nothing changed —
// the text "1:23" rewritten 60×/s identical would needlessly invalidate
// paint. Width updates every frame so the progress bar slides smoothly.
let _lastTimeText = '';
let _lastFillPct  = -1;
const tick = () => {
  if (!lastTrack?.duration) return;
  let el;
  if (lastTrack.isPaused) {
    // Authoritative freeze: isPaused=true is ALWAYS enough, regardless of
    // whether pausedAt was populated. Prefer the server-provided freeze point
    // (pausedAt - startedAt); fall back to whatever elapsed we last computed
    // so the number never climbs.
    if (lastTrack.pausedAt) {
      frozenElapsed = Math.max(0, lastTrack.pausedAt - lastTrack.startedAt);
    } else if (frozenElapsed === null) {
      frozenElapsed = Math.max(0, Date.now() - lastTrack.startedAt);
    }
    el = frozenElapsed;
  } else {
    frozenElapsed = null;
    el = Math.max(0, Date.now() - lastTrack.startedAt);
  }
  // Defensive clamp: never display past the track's own duration. If the client
  // falls out of sync with the server (SSE dies silently, poll hangs, whatever)
  // we still refuse to paint "4:07 / 2:42" — that's never a real state.
  if (lastTrack.duration > 0) el = Math.min(el, lastTrack.duration);
  // Round progress-bar width to 0.1% so consecutive frames skip most writes.
  // 0.1% of a 900 px bar is <1 px — imperceptible yet saves paint work.
  const pct = Math.min(el / lastTrack.duration * 100, 100);
  const pctRounded = Math.round(pct * 10) / 10;
  if (pctRounded !== _lastFillPct) {
    _lastFillPct = pctRounded;
    document.getElementById('progress-fill').style.width = pctRounded + '%';
  }
  const txt = fmt(el);
  if (txt !== _lastTimeText) {
    _lastTimeText = txt;
    document.getElementById('time-current').textContent = txt;
  }
};
// _timerActive gates whether tick() runs from the rAF loop. The tick is now
// driven by drawSpectrum's requestAnimationFrame instead of setInterval —
// that loop already runs at 60 fps whether the timer is on or off, so adding
// a tick() call costs almost nothing AND gives us butter-smooth progress-bar
// motion (was 4 fps before → looked choppy). The interval fallback is kept
// for the rare case where the spectrum is disabled in config.
let _timerActive = false;
const startTimer = () => {
  stopTimer();
  _timerActive = true;
  tick();
  // Interval is a tiny watchdog — if rAF isn't painting (e.g. spectrum off
  // and the tab isn't focused), this still nudges the clock 4×/s.
  timer = setInterval(tick, 250);
};
const stopTimer = () => {
  _timerActive = false;
  if (timer) { clearInterval(timer); timer = null; }
};

// Marquee: scrolls LEFT only, then snaps instantly back — speed from config.
// v6.2.3: removed the .marquee-active class toggle (v6.1.9 experiment —
// pre-revert we didn't have a fade mask at all). Plain scroll animation
// with no per-scroll-state CSS changes.
// v8.0.0: applyMarquee now accepts an optional `which` arg ('title' | 'artist')
// so the artist label can use its own marqueeSpeed / marqueePause settings
// without forcing both elements to share the title's timing. Each element gets
// its own @keyframes block (id='_mq-title' / '_mq-artist') so they don't
// stomp each other when both overflow at the same time.
function applyMarquee(el, text, which) {
  which = which || 'title';
  el.style.animation = 'none';
  el.textContent = text;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const ov = el.scrollWidth - el.parentElement.clientWidth;
    if (ov > 4) {
      const cfg    = _cfg[which] || _cfg.title;   // fall back to title if missing
      const speed  = cfg.marqueeSpeed ?? 68;
      const pause  = cfg.marqueePause ?? 2;
      const travel = ov / Math.max(1, speed);
      const total  = pause + travel + pause + 0.01;
      const p1 = (pause                  / total * 100).toFixed(3);
      const p2 = ((pause + travel)        / total * 100).toFixed(3);
      const p3 = ((pause + travel + pause)/ total * 100).toFixed(3);
      const styleId = '_mq-' + which;
      const animName = '_mq_' + which;
      let s = document.getElementById(styleId);
      if (!s) { s = document.createElement('style'); s.id = styleId; document.head.appendChild(s); }
      s.textContent =
        `@keyframes ${animName}{` +
        `0%,${p1}%{transform:translateX(0)}` +
        `${p2}%,${p3}%{transform:translateX(-${ov}px)}` +
        `100%{transform:translateX(0)}}`;
      el.style.animation = `${animName} ${total.toFixed(2)}s linear infinite`;
    }
  }));
}

function setArt(url) {
  const img = document.getElementById('artwork');
  const fb  = document.getElementById('artwork-fallback');
  if (!url) {
    img.style.opacity = '0';
    // Save the hide-timer ref so a subsequent setArt(url) can cancel it —
    // otherwise that timer would fire AFTER the new image loaded and hide
    // the newly-visible <img> again (repro: restart Master's FM mid-song,
    // server sends empty trackArt first, then resolves art ~400ms later —
    // without cancellation the album art never appeared in OBS).
    clearTimeout(img._hideTimer);
    img._hideTimer = setTimeout(() => {
      img._hideTimer = null;
      img.style.display = 'none'; fb.style.display = 'flex';
    }, 350);
    // Keep _lastPalette from the previous track so spectrum doesn't flash rainbow
    // during the 1-2s art-resolution gap on track change. Palette updates when new
    // art loads. Only truly clear if no art arrives after 4s (genuinely art-less track).
    clearTimeout(img._paletteClearTimer);
    img._paletteClearTimer = setTimeout(() => {
      _lastPalette = null;
      if (_cfg?.dynamicColors?.enabled) clearDynamicPalette();
    }, 4000);
    return;
  }
  clearTimeout(img._paletteClearTimer); // real art arriving — cancel any pending clear
  clearTimeout(img._hideTimer);         // cancel pending display:none from prior setArt('')
  img._hideTimer = null;
  // Route the main image through /art?t=<now> instead of the raw CDN URL. The
  // proxy emits Cache-Control: no-store so OBS Browser Source (CEF) can't
  // latch onto a stale cached response — "refresh cache" was previously the
  // only way to recover after CEF served a blank or partial image. Cache-
  // buster also forces a fresh fetch on every track change. Server-side the
  // proxy serves currentTrack.trackArt, which SSE has already synced to `url`.
  const proxied = `/art?t=${Date.now()}`;
  // Preload then crossfade in
  const tmp = new Image();
  tmp.onload = () => {
    img.style.opacity = '0';
    img.onload  = null;
    img.onerror = null;
    img.src = proxied;
    img.style.display = 'block';
    fb.style.display  = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => { img.style.opacity = '1'; }));
    // Extract palette via /art proxy (localhost — no CORS restrictions)
    if (_cfg?.dynamicColors?.enabled) {
      const palTmp = new Image();
      palTmp.crossOrigin = 'anonymous';
      palTmp.onload = () => {
        overlayLog('INFO', `DynColors: sampling via /art proxy`);
        const palette = extractPalette(palTmp);
        _lastPalette = palette;
        if (palette) applyDynamicPalette(palette);
        else { overlayLog('WARN', 'DynColors: no palette — reverting to preset'); clearDynamicPalette(); }
      };
      palTmp.src = `/art?t=${Date.now()}`;
    }
  };
  tmp.onerror = () => {
    overlayLog('WARN', `setArt: /art proxy preload failed — falling back to raw URL`);
    // Proxy failed (server not reachable?) — fall back to raw URL so we still
    // display something.
    img.src = url;
    img.style.display = 'block';
    fb.style.display  = 'none';
    requestAnimationFrame(() => requestAnimationFrame(() => { img.style.opacity = '1'; }));
  };
  tmp.src = proxied;
}

function setDuration(dur) {
  const bar = document.getElementById('time-bar');
  const progressEnabled = bar._progressEnabled !== false;
  if (dur > 0 && progressEnabled) {
    document.getElementById('time-total').textContent = fmt(dur);
    bar.classList.remove('hidden');
    startTimer();
  } else {
    bar.classList.add('hidden');
    stopTimer();
  }
}

// Get platform label for track source badge
function getPlatformLabel(src) {
  if (!src || src === 'Last.fm') return '';
  if (src === 'Webhook') return _cfg.platformBadge?.soundcloudLabel || 'SoundCloud';
  return src;  // 'Spotify', 'osu!', 'VLC', 'Chrome', etc. — show as-is
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// Phase M #2A: prefer the cascade-resolved HTTPS URL when present, fall back
// to the raw primary art (typically the SMTC data: URI).  Discord and the
// tray menu already prefer trackArtHttps; this brings the OBS overlay in
// line so a Chrome favicon published by SMTC doesn't end up on screen when
// the cascade has the correct YouTube/SoundCloud/etc. thumbnail available.
const bestArt = d => (d && (d.trackArtHttps || d.trackArt)) || '';

let _transitioning = false;
// Rapid-scroll queue. When a new track arrives mid-transition (e.g. you
// scroll through osu! song-select), remember the latest one and re-transition
// to it as soon as the current slide-in completes. Only the *most recent*
// track is retained; intermediate ones are intentionally dropped.
let _pendingTransition = null;

// Apply track content directly (no animation — used while widget is hidden).
// Prefer the freshest server data from _latestData: art resolution runs
// asynchronously on the server (~400ms for SoundCloud), so by the time this
// runs after the slide-out animation, trackArt may have resolved even if the
// `d` captured at transition start was empty.
function applyTrackContent(d) {
  const latest = (_latestData && _latestData.track === d.track && _latestData.artist === d.artist)
    ? _latestData : d;

  applyMarquee(document.getElementById('track-title'), latest.track  || 'Unknown Track', 'title');
  // v8.0.0: artist now gets its own marquee using cfg.artist.marqueeSpeed +
  // cfg.artist.marqueePause. Falls back to a static label if it fits.
  applyMarquee(document.getElementById('artist'), latest.artist || 'Unknown Artist', 'artist');

  const pl   = document.getElementById('platform-label');
  const name = (pl._badgeEnabled !== false) ? getPlatformLabel(latest.source) : '';
  pl.textContent   = name;
  pl.style.display = name ? '' : 'none';

  if (_cfg.art.enabled) setArt(bestArt(latest));
  setDuration(latest.duration || 0);

  // Keep poll() in sync so it doesn't redundantly re-apply the same art
  lastArt = bestArt(latest);
}

// Slide out → swap content → slide in (seamless song change).
// When crossfadeOnSkip is enabled the whole card stays on screen — only the
// art and text fade out then back in, giving a much smoother feel on skip.
async function transitionToTrack(d) {
  if (_transitioning) {
    // Already animating — stash the newest requested track so we can land on
    // it the moment the current slide-in finishes (see queue drain below).
    _pendingTransition = d;
    return;
  }
  _transitioning = true;

  const widget    = document.getElementById('widget');
  const isVisible = widget.classList.contains('visible');
  const animDur   = (_cfg.showAnimation?.duration ?? 0.5) * 1000;
  // Crossfade only makes sense when the card is already visible — first appear
  // always uses the normal slide-in so there's something to animate into.
  const crossfade = !!_cfg.showAnimation?.crossfadeOnSkip && isVisible;

  // Clear stale progress immediately — prevents old end-time flashing on new track
  setDuration(0);

  // Elements that change per-song and should crossfade.
  // time-bar is included so old timestamps/progress don't show during the swap.
  const _fadeEls = () => ['track-title','artist','platform-label','time-bar']
    .map(id => document.getElementById(id)).filter(Boolean);
  const FADE_MS  = 260; // fast enough to feel snappy, slow enough to read

  if (crossfade) {
    // Fade only the track title, artist, platform badge, and album art out.
    // Everything else (card background, border, spectrum, timestamps) stays live.
    _fadeEls().forEach(el => {
      el.style.transition = `opacity ${FADE_MS}ms ease`;
      el.style.opacity    = '0';
    });
    const artImg = document.getElementById('artwork');
    if (artImg) { artImg.style.transition = `opacity ${FADE_MS}ms ease`; artImg.style.opacity = '0'; }
    stopTimer();
    await sleep(FADE_MS + 20);
  } else if (isVisible) {
    widget.classList.remove('visible');           // trigger slide-out
    stopTimer();
    await sleep(animDur + 80);                    // wait for exit animation
  }

  // If more recent tracks arrived during the fade/slide, jump straight to the
  // latest one — no point rendering a track the user already scrolled past.
  if (_pendingTransition) {
    d = _pendingTransition;
    _pendingTransition = null;
  }

  // Refresh right before applying so we pick up art that resolved during the
  // animation (server SoundCloud search ~400ms, slide-out ~580ms default).
  try {
    const fresh = await fetch('/current').then(r => r.json());
    if (fresh && fresh.track === d.track && fresh.artist === d.artist) {
      _latestData = fresh;
    }
  } catch (e) { overlayLog('WARN', `transition /current refresh failed: ${e.message}`); }

  applyTrackContent(d);                           // update content while hidden/faded
  lastTrack = { ...d };                           // sync so poll() won't treat it as new
  lastArt   = bestArt(d);
  await sleep(20);                                // tiny settle delay

  if (crossfade) {
    // Fade the text elements back in. Album art is handled by setArt() inside
    // applyTrackContent — it preloads the new image then fades the <img> in,
    // so we just clear the inline opacity/transition we set during fade-out.
    _fadeEls().forEach(el => { el.style.opacity = ''; });
    setTimeout(() => {
      _fadeEls().forEach(el => { el.style.transition = ''; });
      const artImg = document.getElementById('artwork');
      if (artImg) { artImg.style.transition = ''; }
    }, FADE_MS + 80);
  } else {
    widget.classList.add('visible');              // slide in
  }

  _transitioning = false;

  // Drain: if another track was queued DURING the slide-in, transition to it now.
  if (_pendingTransition) {
    const next = _pendingTransition;
    _pendingTransition = null;
    transitionToTrack(next);
  }
}

function showTrack(d) {
  transitionToTrack(d);
}

const hideWidget = () => {
  document.getElementById('widget').classList.remove('visible');
  stopTimer();
};

// postMessage from customize page — replay slide-in animation for preview
window.addEventListener('message', async e => {
  if (e.data !== 'anim-demo') return;
  // Force-fetch latest config so easing/direction/duration are current
  try {
    const d = await fetch('/preview-config').then(r => r.json());
    applyConfig(d);
  } catch (err) { overlayLog('WARN', `anim-demo /preview-config failed: ${err.message}`); }
  const widget  = document.getElementById('widget');
  const animDur = (_cfg.showAnimation?.duration ?? 0.5) * 1000;
  widget.classList.remove('visible');
  setTimeout(() => widget.classList.add('visible'), animDur + 80);
});

let _latestData = null;

async function poll() {
  try {
    const d = await fetch('/current').then(r => r.json());
    if (_transitioning) {
      // If a newer track showed up while animating (e.g. user scrolled
      // osu! song-select), queue it — transitionToTrack drains on completion.
      // Any non-new heartbeat is ignored so we don't fight the fade.
      if (d && (!lastTrack || d.track !== lastTrack.track || d.artist !== lastTrack.artist)) {
        _pendingTransition = d;
      }
      return;
    }
    if (!d) { _latestData = null; lastTrack = null; lastArt = ''; hideWidget(); return; }
    _latestData = d;  // kept fresh so applyTrackContent (runs after slide-out) sees resolved art

    const newArt     = bestArt(d);
    const isNew      = !lastTrack || d.track !== lastTrack.track || d.artist !== lastTrack.artist;
    const forceArt   = _sseNeedsArtRefresh && newArt;
    const artChanged = (!isNew && newArt && newArt !== lastArt) || forceArt;
    const durChanged = !isNew && d.duration > 0 && d.duration !== lastTrack?.duration;

    if (isNew) {
      lastTrack = { ...d }; lastArt = newArt;
      showTrack(d);
      _sseNeedsArtRefresh = false;
      return;  // let transitionToTrack fully own this cycle
    }
    if (artChanged) {
      lastArt = newArt; setArt(newArt);   // smooth art crossfade
      if (forceArt) overlayLog('INFO', `Art force-refreshed after SSE reconnect (poll)`);
      _sseNeedsArtRefresh = false;
    }
    // Always sync startedAt from server — picks up both seek corrections and
    // the server's continuous drift auto-correction immediately.
    if (d.startedAt) lastTrack.startedAt = d.startedAt;
    if (durChanged) {
      lastTrack.duration = d.duration;
      setDuration(d.duration);
    }
    // Sync pause state — freezes progress bar on pause, resumes on unpause
    lastTrack.isPaused = !!d.isPaused;
    lastTrack.pausedAt = d.pausedAt || 0;

    // Pause handling: 1-second debounce before freezing the timer. This gives
    // the sync tick one full cycle to correct the position before locking it in.
    const widget     = document.getElementById('widget');
    const wasVisible = widget.classList.contains('visible');
    if (d.isPaused) {
      if (!_pauseDebounce) {
        _pauseDebounce = setTimeout(() => {
          _pauseDebounce = null;
          if (!lastTrack?.isPaused) return; // resumed before debounce fired
          stopTimer();
          tick();
          // If "keep visible on pause" is off, hide after 10 s of being paused.
          if (!_cfg.pauseBehavior?.keepVisibleOnPause) {
            if (lastTrack.pausedAt) {
              const pausedFor = Date.now() - lastTrack.pausedAt;
              if (pausedFor > 10000 && widget.classList.contains('visible')) {
                widget.classList.remove('visible');
              }
            }
          }
        }, 1000);
      }
    } else {
      // Resumed — cancel any pending pause debounce immediately
      if (_pauseDebounce) { clearTimeout(_pauseDebounce); _pauseDebounce = null; }
      if (!wasVisible && !isNew && lastTrack) {

// Stage 7.12 Batch B Phase C #5: poll cadence raised back from 100 ms → 2000 ms.
//
// The v6.6.2 change to 100 ms was a workaround for the pre-Phase-B Discord/SSE
// pipeline being too slow on its own.  With Phase A (state-aware tray dedup,
// 100 ms heartbeat, 16 ms SMTC drain), Phase B (native Discord IPC pipe), and
// Phase C (server broadcast dedup), the SSE push from the server arrives at
// the overlay within 5-30 ms of the user input — there's nothing for a 100 ms
// poll to reconcile.
//

// has silently died (rare; CEF reconnects automatically within ~2 s of a server
// restart) and for the initial state on a brand-new connection (handled by the
// poll() call immediately above this line).  2000 ms is plenty.

// ── Server-Sent Events: near-zero-latency track updates ─────────────────

  if (!d) { _latestData = null; lastTrack = null; lastArt = ''; hideWidget(); return; }

    if (forceArt) overlayLog('INFO', `Art force-refreshed after SSE reconnect`);
    _sseNeedsArtRefresh = false;
  }
  if (d.startedAt) lastTrack.startedAt = d.startedAt;
  if (durChanged) { lastTrack.duration = d.duration; setDuration(d.duration); }
  lastTrack.isPaused = !!d.isPaused;
  lastTrack.pausedAt = d.pausedAt || 0;
  const widget     = document.getElementById('widget');
  const wasVisible = widget.classList.contains('visible');
  if (d.isPaused) {
    if (!_pauseDebounce) {
      _pauseDebounce = setTimeout(() => {
        _pauseDebounce = null;
        if (!lastTrack?.isPaused) return;
        stopTimer();
        tick();
        if (!_cfg.pauseBehavior?.keepVisibleOnPause) {
          if (lastTrack.pausedAt) {

            }

        }
      }, 1000);
    }

    if (_pauseDebounce) { clearTimeout(_pauseDebounce); _pauseDebounce = null; }

    }
  }
}

let _sse = null;

// as before. Without this, when Master's FM restarts mid-song OBS Browser
// Source keeps showing its stale cached image (CEF caches aggressively and
// the server sends the same trackArt URL it had before the restart, so the
// overlay's `artChanged` check returns false and setArt is never called).

function connectSSE() {

    // reconnects after server restart / network blip).
    _sseNeedsArtRefresh = true;
    overlayLog('INFO', 'SSE connected — art will force-refresh on next update');
  };
  _sse.onmessage = e => {
    try { applyServerUpdate(e.data ? JSON.parse(e.data) : null); }
    catch (err) { overlayLog('ERROR', `SSE onmessage parse/apply failed: ${err.message} (${e.data ? e.data.slice(0,120) : 'empty'})`); }
  };
  // v8.0.7: live customize-panel changes arrive as `event: preview-config`.
  // ONLY the customize-page iframe (loaded with ?preview=1) should respond
  // to these — the OBS Browser Source must keep showing whatever was last
  // saved with Apply to OBS. Previously the OBS overlay also subscribed,
  // which caused the "every slider tweak instantly hits stream, then 5s
  // later flips back to the saved config when the polling re-fetches
  // /overlay-config" bug users were seeing. Now the OBS overlay only
  // updates on `event: overlay-config` (fired by /save-overlay-config),
  // which is exactly what Apply to OBS triggers.
  if (_IS_PREVIEW) {
    _sse.addEventListener('preview-config', e => {
      try {
        const cfg = JSON.parse(e.data);
        const s   = JSON.stringify(cfg);
        if (s !== _lastCfgStr) {
          _lastCfgStr = s;
          applyConfig(cfg);
        }
      } catch (err) { overlayLog('ERROR', `SSE preview-config parse/apply failed: ${err.message}`); }
    });
  }
  _sse.addEventListener('overlay-config', e => {
    try {
      const cfg = JSON.parse(e.data);
      const s   = JSON.stringify(cfg);

        _lastCfgStr = s;
        applyConfig(cfg);
      }
    } catch (err) { overlayLog('ERROR', `SSE overlay-config parse/apply failed: ${err.message}`); }
  });
  // v9.2.0: capture event — server requests a PNG of the current canvas
  // for visual verification by external test tools. Replies via POST to
  // /screenshot-response with {requestId, png:"data:image/png;base64,..."}.
  // Errors are reported via the same POST with {requestId, error}. Each
  // overlay handles independently; first response wins server-side.
  _sse.addEventListener('capture', e => {
    let requestId = '';
    try {
      const body = JSON.parse(e.data || '{}');
      requestId = String(body.requestId || '');
    } catch {}

      try {

      // always returning SOMETHING valid.
      const canvasId = document.getElementById('spectrum-canvas-gl') ? 'spectrum-canvas-gl' : 'spectrum-canvas';
      const canvas = document.getElementById(canvasId);
      if (!canvas) { replyError(canvasId + ' not found in DOM'); return; }

      // preserveDrawingBuffer, toDataURL must run inside a rAF callback so
      // the GPU framebuffer is still readable.
      requestAnimationFrame(() => {

          const png = canvas.toDataURL('image/png');
          fetch('/screenshot-response', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId, png, source: canvasId }),
          }).catch(() => {});
        } catch (err) {
          replyError('toDataURL threw: ' + (err && err.message));

    }

}
connectSSE();

// ── Server-restart auto-reload ─────────────────────────────────────────────
// CEF (OBS Browser Source) aggressively caches overlay.html, so when
// Master's FM is rebuilt or restarted the overlay keeps running stale code
// AND ignores album-art URL refreshes. Poll /version every 3 s; when the
// bootId changes we force a hard reload so everything (HTML, JS, images)
// is re-fetched fresh. A cache-busting query string pushes CEF past any
// in-memory cache of the HTML document itself.
let _bootId = null;
async function checkServerVersion() {
  try {
    const r = await fetch('/version', { cache: 'no-store' });
    const v = await r.json();
    if (_bootId === null) {
      _bootId = v.bootId;
      return;
    }
    if (v.bootId && v.bootId !== _bootId) {
      overlayLog('INFO', `Server rebooted (bootId ${_bootId} → ${v.bootId}) — force-reloading overlay`);
      // location.reload(true) with a cache-busting URL param bypasses CEF's
      // disk cache so the newest HTML/JS is served.
      const u = new URL(window.location.href);
      u.searchParams.set('_reload', Date.now());
      window.location.replace(u.toString());
    }
  } catch { /* server briefly unreachable during restart — ignore */ }
}
checkServerVersion();
setInterval(checkServerVersion, 3000);


// ══════════════════════════════════════════════════════════════════════════
//  SPECTRUM VISUALIZER
// ══════════════════════════════════════════════════════════════════════════

let analyser = null, freqData = null, audioReady = false;

// ── v2.1.0 WASAPI-loopback spectrum (preferred) ────────────────────────────
// audio_spectrum.exe runs alongside MastersFM.exe and exposes an SSE feed
// at http://127.0.0.1:4243/spectrum — 60 log-spaced frequency bands per
// frame, 0-255 each, matching the shape of getByteFrequencyData().  We
// prefer this over getUserMedia because it captures whatever the OS is
// ACTUALLY playing (Spotify / SoundCloud / YouTube / whatever) without
// needing OBS to route audio into the browser source.
let _loopbackBands     = null;   // Uint8Array | null — raw from SSE
let _renderedBands     = null;   // Float32Array | null — per-rAF lerp target
let _peakHoldEnd       = null;   // Float64Array | null — Phase T.6 per-band peak-hold expiry timestamps (performance.now() ms)
let _decimatedBands    = null;   // Float32Array | null — barCount-decimated view of _renderedBands
let _decimatedLen      = 0;      // cached length so we only reallocate when barCount changes
let _normPeak          = 20;     // rolling max band value (for spectrum.autoGain)
let _loopbackUpdatedAt = 0;      // performance.now() of last frame
let _loopbackSSE       = null;
let _loopbackSseFps    = 0;      // v8.3.0: last fps value sent in ?fps= query
let _loopbackBackoff   = 2000;   // exponential reconnect with cap
// v8.3.7: cached spectrum fillStyle gradient. drawSpectrum builds a
// CanvasGradient via createLinearGradient + multiple addColorStop on every
// rAF tick (~144/sec); cache key includes color mode + canvas size + base
// rgb / dyn-color hash so static modes reuse the gradient indefinitely
// and rainbow mode reuses across the ~3 rAF ticks within each integer
// hue-degree window (saves most of the ~144 gradient-rebuilds/sec).
let _cachedFillKey     = '';
let _cachedFill        = null;
let _loopbackLatestRaw = null;   // v6.5.3: raw SSE event data, parsed at rAF
let _spectrumParseFails = 0;     // rolling count of malformed SSE frames
let _spectrumParseLastLog = 0;   // perf.now() of last flush-to-log
let _spectrumDisconnectLogged = false; // only log the first disconnect per outage
// Stage 7.12 Batch B Phase S Finding B: eager-decode throttle. v8.3.4
// deferred decode to rAF for CPU reasons but cost ~0-16.67 ms (avg ~8 ms
// on 60 Hz) of latency — SSE arrives, sits as a raw string, decoded
// only when the next rAF fires. Phase S: decode on arrival IF >=5 ms
// have passed since the last decode. Preserves CPU savings against
// bursty arrivals (each OnData fires up to 10 SSE signals in <1 ms),
// while ensuring the bands array is already-decoded by the time rAF
// reads it. Effective: ~4-8 ms cut from the latency budget on 60 Hz.
let _lastLoopbackDecodeAt = 0;
const LOOPBACK_DECODE_MIN_GAP_MS = 5;

// v8.3.4: decode the most recently STASHED SSE frame into _loopbackBands.
// Called by drawSpectrum right before it reads bands, so we only ever parse
// the freshest payload that's going to hit the canvas this frame.
// This pattern decouples SSE arrival rate from JS-side decode cost. At
// SSE rate 1000 fps on a 144 Hz monitor, the previous on-arrival decode
// did ~1000 atob + 480-element array fill per second (~25 % of one core
// just for SSE work, leaving little budget for the canvas redraw during
// hardcore drops). With stash-and-decode-at-rAF, decode runs at rAF rate
// (~144/sec) regardless of SSE rate — same visual smoothness because the
// canvas can only display monitor-refresh frames anyway, but ~7× lower
// JS overhead at high SSE settings.
function _decodeLatestLoopback() {
  const raw = _loopbackLatestRaw;
  if (raw === null) return;
  _loopbackLatestRaw = null;
  try {
    // v7.0.10: server emits raw base64 directly (no JSON wrapper). Client
    // does a single atob and a tight charCodeAt loop. Legacy v6.5.2 JSON
    // format support is removed — server has emitted raw since v7.0.9 and
    // any in-flight clients refresh on overlay reload.
    const bin = atob(raw);
    const len = bin.length;
    if (!_loopbackBands || _loopbackBands.length !== len) {
      _loopbackBands = new Uint8Array(len);
    }
    for (let i = 0; i < len; i++) _loopbackBands[i] = bin.charCodeAt(i);

    _spectrumParseFails = (_spectrumParseFails || 0) + 1;
    const now = performance.now();
    if (!_spectrumParseLastLog || (now - _spectrumParseLastLog) > 10000) {
      _spectrumParseLastLog = now;
      overlayLog('WARN', `spectrum SSE parse failed ${_spectrumParseFails}x in last ~10s (example: ${err.message})`);
      _spectrumParseFails = 0;
    }
  }
}
function connectSpectrumSSE() {

  // tweak colors + spectrum height without seeing if the live audio
  // actually drove the bars as expected. Cost is tiny because the
  // preview rAF is throttled to 30 fps by the earlier v5 optimization.

    if (_loopbackSSE) { try { _loopbackSSE.close(); } catch {} }

    // mode). At fps=2000 the server sends only when s_frame changes — i.e.
    // exactly once per FFT publish (~120/sec, tied to SSE_INTERVAL_MS=8ms).
    // No duplicate frames are ever sent, so SSE traffic is ~77 KB/s regardless
    // of what the render-fps slider is set to. This decouples audio response
    // latency (always ≤8ms from FFT) from render smoothness (controlled by
    // cfg.spectrum.fps in drawSpectrum). Previously fps=N drove BOTH the SSE
    // rate AND the rAF cap; at fps=1000 the server sent 1000 duplicate sends/sec
    // (640 KB/s + 1000 context-switches/sec) with no visual benefit since the
    // rAF could only render at monitor refresh rate. At fps=2000 that overhead
    // is zero — SSE CPU cost is constant at the natural FFT rate.

    // audio_spectrum.exe always starts at HOP=512 (10.7 ms); the saved
    // responseMs is only honoured when the user moves the slider in customize.

    // including after an audio_spectrum.exe crash-and-restart.
    try {
      const _hopMs = Math.max(0.01, _cfg?.spectrum?.responseMs ?? 10.7);

        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ms: _hopMs })
      }).catch(() => {});
    } catch (_) {}
    _loopbackSSE.onopen = () => {
      if (_spectrumDisconnectLogged) {
        overlayLog('INFO', 'WASAPI spectrum re-connected after outage');
      } else {
        overlayLog('INFO', 'WASAPI spectrum connected');
      }
      _spectrumDisconnectLogged = false;
      _loopbackBackoff = 2000;
    };
    _loopbackSSE.onmessage = e => {
      // v6.6.6: reverted to on-arrival parsing. The v6.5.3 'stash +
      // parse at rAF' scheme was bottlenecking bar updates.
      // v8.3.4: STASH-AND-DECODE-AT-RAF. CPU-saving optimization that
      // cost ~0-16.67 ms (avg ~8 ms on 60 Hz) of latency.
      // Stage 7.12 Batch B Phase S Finding B: hybrid eager-decode.
      // Stash first (so the rAF code path that reads _loopbackLatestRaw
      // still works as a fallback). If >=5 ms have passed since the last
      // decode, also decode RIGHT NOW so _loopbackBands is fresh by the
      // time the next rAF fires. Preserves the CPU win against bursty
      // arrivals (server fires ~10 SSE signals per OnData in <1 ms; the
      // 5 ms gate collapses those into one decode) while ensuring the
      // rAF doesn't pay an additional ~8 ms wait for the decode.
      if (typeof e.data !== 'string' || !e.data) return;
      _loopbackLatestRaw  = e.data;          // stash (kept for rAF fallback path)

      try { _loopbackSSE.close(); } catch {}

      // pound the port.  Fresh launch (after MSI reinstall) takes ~1 s.

      // audio_spectrum.exe silently falls through to the simulator and
      // the user has no idea why their music visualization went flat.
      if (!_spectrumDisconnectLogged) {

connectSpectrumSSE();

async function initAudio() {
  try {
    const permStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    permStream.getTracks().forEach(t => t.stop());

    const all    = await navigator.mediaDevices.enumerateDevices();
    const inputs = all.filter(d => d.kind === 'audioinput');
    console.log('[Overlay] Audio inputs found:');
    inputs.forEach((d, i) => console.log(`  [${i}] ${d.label}`));

    const loopbackTerms = [
      'stereo mix', 'what u hear', 'wave out mix',
      'vb-audio', 'vb audio', 'coconut',
      'voicemeeter', 'voicemeter',
      'cable output', 'cable-a', 'cable-b',
      'loopback', 'wasapi loopback', 'mix output',
    ];

    let chosen = null;

    // URL override: ?device=0  or  ?device=stereo
    const urlParam = new URLSearchParams(location.search).get('device');
    if (urlParam !== null) {
      chosen = inputs[parseInt(urlParam, 10)] ||
               inputs.find(d => d.label.toLowerCase().includes(urlParam.toLowerCase())) || null;
      if (chosen) console.log(`[Overlay] URL override → ${chosen.label}`);
    }

    if (!chosen) {
      for (const term of loopbackTerms) {
        chosen = inputs.find(d => d.label.toLowerCase().includes(term));
        if (chosen) { console.log(`[Overlay] Auto-detected → ${chosen.label}`); break; }
      }
    }

    if (!chosen) {
      chosen = inputs[0];
      console.log(`[Overlay] Using default → ${chosen?.label}`);
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        deviceId: chosen ? { exact: chosen.deviceId } : undefined,
        echoCancellation: false, noiseSuppression: false,
        autoGainControl: false,  latency: 0,
      },
      video: false,
    });

    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const src  = actx.createMediaStreamSource(stream);
    analyser   = actx.createAnalyser();
    analyser.fftSize               = 2048;
    analyser.smoothingTimeConstant = _cfg.spectrum.smoothing;
    analyser.minDecibels           = -85;
    analyser.maxDecibels           = -10;
    src.connect(analyser);
    freqData   = new Uint8Array(analyser.frequencyBinCount);
    audioReady = true;
    console.log(`[Overlay] ✅ Capturing from: ${chosen?.label || 'default'}`);
  } catch(e) {
    console.log('[Overlay] ⚠️ Audio unavailable, using simulator:', e.message);
    overlayLog('WARN', `initAudio getUserMedia failed - falling back to simulator: ${e.message}`);
  }
}

// ── Chill spectrum simulator ───────────────────────────────────────────────
// Pre-allocated at 100 bars max; drawSpectrum only uses _cfg.spectrum.barCount.
const MAX_SIM = 480;   // v6.3.3: matches audio_spectrum.exe's BAND_COUNT (raised 240->480 so the spectrum resolves individual frequency spikes sharply - 48 bars per octave, 4x the detail of a pro-audio parametric EQ).
const simVals = new Float32Array(MAX_SIM).fill(0.10);
const simTgts = new Float32Array(MAX_SIM).fill(0.10);
const simFreq  = Array.from({length:MAX_SIM}, (_, i) => 0.35 + (i/MAX_SIM)*1.1 + Math.random()*0.4);
const simPhase = Array.from({length:MAX_SIM}, () => Math.random()*Math.PI*2);
const SIM_SHAPE = Array.from({length:MAX_SIM}, (_, i) => {
  const t = i/(MAX_SIM-1);
  return 0.78*Math.exp(-t*1.9) + 0.22*(1-t*0.55);
});
const SIM_DECAY = Array.from({length:MAX_SIM}, (_, i) => 0.91 - (i/(MAX_SIM-1))*0.14);

let nextEvent = 0;

function simTick(t, NUM) {
  if (t >= nextEvent) {
    const tPos   = Math.pow(Math.random(), 1.3);
    const center = Math.floor(1 + tPos * (NUM-6));
    const width  = 3 + Math.floor(Math.random() * 9);
    const level  = (0.58 + Math.random()*0.38) * (1 - tPos*0.30);
    for (let i = Math.max(0,center-width); i <= Math.min(NUM-1,center+width); i++) {
      const dist = Math.abs(i-center)/width;
      simTgts[i] = Math.max(simTgts[i], level*Math.exp(-dist*dist*1.8));
    }
    nextEvent = t + 0.25 + Math.random()*0.55;
  }
  for (let i = 0; i < NUM; i++) {
    const osc     = 0.5+0.5*Math.sin(t*simFreq[i]+simPhase[i]);
    const osc2    = 0.5+0.5*Math.sin(t*simFreq[i]*0.53+simPhase[i]+2.1);
    const ambient = SIM_SHAPE[i]*(0.50+0.50*(osc*0.65+osc2*0.35));

    console.log('[webgl] FIRST RENDER ok: cw=' + cw + ' ch=' + ch + ' bandLen=' + bandLen + ' colorMode=' + colorMode + ' gainScale=' + gainScale.toFixed(4) + ' minBarPx=' + minBarPx + ' heightMult=' + heightMult + ' bands[0..7]=' + sample.join(','));

// ── end v9.2.0 WebGL renderer ──────────────────────────────────────────────

function drawSpectrum() {
  // v9.9.3: in OBS, rAF is throttled by the browser-source FPS setting.
  // setInterval (set up at the call site below) drives the loop instead.
  if (!_inOBS) requestAnimationFrame(drawSpectrum);

  // v8.0.0 — skip ALL spectrum + tick work when the document isn't
  // visible (minimized windows / background tabs). CEF/Chromium already
  // slows rAF when hidden, but compositor runs sometimes continue —
  // this keeps us explicit-zero.
  if (document.hidden) return;

  // Stage 7.12 Batch B Phase S Finding K: cap raised 120 → 480. rAF is
  // naturally bounded by monitor refresh (60/120/144/240 Hz), so the
  // cap at 120 was throttling 144/240 Hz displays to ~72/60 fps
  // effective. WebGL render is sub-ms (texSubImage2D + 6-vertex
  // drawArrays); per-frame CPU/GPU cost at 240+ fps stays trivial on
  // modern hardware. The slider still goes to 120 by default; users
  // who want their full monitor refresh can raise it in customize.
  const fpsCap = Math.max(30, Math.min(480, _cfg.spectrum?.fps ?? 240));
  const minGap = 1000 / fpsCap;
  const now    = performance.now();
  // v6.5.4: the -0.5 ms fudge-factor handles rAF clock jitter. At

  _lastDrawAt = now;

  // _loopbackBands. Decoupling SSE arrival rate from decode rate cuts JS
  // overhead ~7× at fps=1000 SSE / 144 Hz monitor — critical headroom for
  // the canvas redraw loop during high-amplitude content (drops/hardcore).
  _decodeLatestLoopback();

  // Piggy-back the progress-bar/timestamp tick on the rAF loop that's already
  // running for the spectrum. Zero extra scheduling cost, and the bar slides
  // smoothly at 60 fps instead of stepping 4×/s. tick() is a no-op when the
  // timer isn't active and is fast-path cached so consecutive same-value
  // frames skip the DOM writes entirely.
  if (_timerActive) tick();

  // ── v9.4.0 WEBGL-ONLY RENDER PATH ─────────────────────────────────────────

  // GPU Acceleration toggle is gone, the ?renderer= URL param is ignored, the
  // _glWantsWebGL/_glActive/_lastRenderMode state machinery is deleted. WebGL
  // initializes lazily on the first drawSpectrum tick (_glInit is sticky-
  // success so this is essentially free after the first call). If WebGL fails
  // to init (rare — bad GPU drivers, ancient CEF), the spectrum doesn't
  // render but the rest of the overlay (text, art, progress bar, glow,
  // border) keeps working — they're all DOM/CSS, not canvas-based.
  if (!_gl.ready && !_gl.initFailed) _glInit();
  if (!_gl.ready) return;   // WebGL init failed; spectrum sits dark

    const t = Math.max(0, Math.min(1, elapsed / _dynSpectrumLerpMs));

    _dynSpectrumColor.g = Math.round(_dynSpectrumColor.g + (_dynSpectrumTarget.g - _dynSpectrumColor.g) * k * 0.12);
    _dynSpectrumColor.b = Math.round(_dynSpectrumColor.b + (_dynSpectrumTarget.b - _dynSpectrumColor.b) * k * 0.12);

  // _renderedBands as an R8 1D texture in _glRender below.
  const _wasapiFreshGL = (_loopbackBands && (now - _loopbackUpdatedAt) < 400);
  const _loopSrcGL = (typeof _cfg.liveAudioVisualizer === 'boolean') ? _cfg.liveAudioVisualizer : true;
  if (_loopSrcGL && _wasapiFreshGL) {
    if (!_renderedBands || _renderedBands.length !== _loopbackBands.length) {
      _renderedBands = new Float32Array(_loopbackBands.length);
    }
    // v9.8.2: heartbeat mode — rise is always instant (true peak detector).
    // Bars snap to the audio peak in the SAME rAF tick the SSE data arrives.
    // No lerp or threshold on the up-path — maximum possible reaction speed.
    //
    // Stage 7.12 Batch B Phase T.1 (2026-05-17 — refined after operator
    // reported "too smooth / delayed" feel on Phase T).
    //
    // Background:
    // - Phase S Finding L set fall floor to 5 ms half-life → 200 BPM
    //   hardcore looked like a 3.3 Hz square-wave strobe (Issue 2).
    //   Sparse non-ASIO SSE arrivals + 5 ms fall → 10 fps perception
    //   on WASAPI/MME/KS (Issue 3).
    // - Phase T fixed strobing via a two-stage knee at 30% of CURRENT
    //   bar value. But the slow phase (60ms half-life ABOVE knee) made
    //   the bar TRAIL the audio: after a kick (100%) returning to bass
    //   (50%), the bar took ~150 ms to settle at the bass level — looking
    //   like the kick was sustaining. Operator: "feels delayed".
    //
    // Phase T.15 (2026-05-17 — operator: now go to T.2): one knob bump
    // from T.1 — fallTrackHL 12+smoothGL*60 → 20+smoothGL*70. Slower
    // than typical LCD response (4-16 ms) so the bar's motion is above
    // the panel refresh — eliminates the ghosting / double-frame
    // perception T.1 had at 12 ms — while still settling kick→bass
    // within ~110 ms (no perceived lag).
    let frameMaxIn = 0;
    for (let k = 0; k < _loopbackBands.length; k++) {
      if (_loopbackBands[k] > frameMaxIn) frameMaxIn = _loopbackBands[k];
    }
    const audioPresent   = frameMaxIn > Math.max(20, _normPeak * 0.20);
    const smoothGL       = Math.max(0, Math.min(1, _cfg.spectrum.smoothing ?? 0));
    const fallTrackHL    = 20 + smoothGL * 70;     // 20-90 ms half-life (Phase T.2 baseline)
    const fallFadeHL     = 80 + smoothGL * 220;    // 80-300 ms silence fade (unchanged)
    const dtMsGL         = Math.min(100, now - (_prevRafTick || now));
    const fallAlphaTrack = 1 - Math.pow(0.5, dtMsGL / fallTrackHL);
    const fallAlphaFade  = 1 - Math.pow(0.5, dtMsGL / fallFadeHL);
    const fallA          = audioPresent ? fallAlphaTrack : fallAlphaFade;
    _prevRafTick = now;
    let frameMaxGL = 0;
    for (let k = 0; k < _renderedBands.length; k++) {
      const tgt = _loopbackBands[k];
      const cur = _renderedBands[k];
      if (tgt >= cur) {
        _renderedBands[k] = tgt;                          // instant rise (heartbeat)
      } else {
        _renderedBands[k] = cur + (tgt - cur) * fallA;    // single-stage exponential decay

      if (_renderedBands[k] > frameMaxGL) frameMaxGL = _renderedBands[k];

    // v9.6.7: honour cfg.barCount by decimating 480 bands → barCount groups.
    // canvas2d drew exactly barCount bars by slicing simVals; WebGL always got
    // all 480 from the SSE texture, making the Number-of-Bars slider a dead
    // control since v9.4.0. Fix: take the max of each group of (480/barCount)
    // bands in JS before uploading the texture so the shader sees the right N.
    const _wantBars = Math.max(1, Math.min(_renderedBands.length, (_cfg.spectrum.barCount ?? 50) | 0));
    let _bandsToRender = _renderedBands;
    if (_wantBars < _renderedBands.length) {
      if (!_decimatedBands || _decimatedLen !== _wantBars) {
        _decimatedBands = new Float32Array(_wantBars);
        _decimatedLen   = _wantBars;
      }
      const _step = _renderedBands.length / _wantBars;
      for (let _i = 0; _i < _wantBars; _i++) {
        const _lo = Math.floor(_i * _step);
        const _hi = Math.min(Math.floor((_i + 1) * _step), _renderedBands.length);

        for (let _j = _lo; _j < _hi; _j++) { if (_renderedBands[_j] > _mx) _mx = _renderedBands[_j]; }

    }
    _glRender(_bandsToRender, _cfg.spectrum, baseRgb_glFast, _dynSpectrumColor, hueOffsetDegFast, _normPeak);
  }
}

// trigger a microphone permission popup that alarms users. The spectrum just

if (!_IS_PREVIEW) initAudio();
if (_inOBS) {

  // fps regardless of the OBS browser-source FPS setting. First draw fires now.
  const _obsIntervalMs = Math.round(1000 / 120); // 8 ms ≈ 120 fps
  setInterval(drawSpectrum, _obsIntervalMs);

} else {
  drawSpectrum(); // self-schedules via requestAnimationFrame inside
}
