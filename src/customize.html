            'c-anim-dir':               ['showAnimation', 'direction'],
            'c-anim-easing':            ['showAnimation', 'easing'],
            'c-anim-crossfade':         ['showAnimation', 'crossfadeOnSkip'],
            'c-anim-crossfade-scope':   ['showAnimation', 'crossfadeScope']
            // Intentionally NOT mapped (UI-only / meta-state; see log S0.4):
            //   c-theme                    -- theme name; managed by applyTheme; no overlay-bound nested path
            //   c-spec-sensitivity-reset   -- button; dispatches event on c-spec-sensitivity slider; no own state
        };

        // Stage 7.32: deep-merge `over` onto a deep CLONE of `base`, returning a
        // NEW object (neither input is mutated). Plain objects recurse; arrays +
        // primitives from `over` REPLACE wholesale (so border.colors /
        // progressBar.fillColors arrays from flatToNested overwrite, never merge
        // element-wise). Used to layer current control values (flatToNested) on
        // top of the full nested passthrough (State.nested) for export / save /
        // preview, and to fold an imported config into State.nested -- the key to
        // lossless layout round-trip. Config is JSON-safe so structuredClone via
        // JSON is sufficient.
        function deepMerge(base, over) {
            const isPlain = v => v && typeof v === 'object' && !Array.isArray(v);
            const clone = v => (v && typeof v === 'object') ? JSON.parse(JSON.stringify(v)) : v;
            if (!isPlain(base)) return isPlain(over) ? deepMerge({}, over) : clone(over !== undefined ? over : base);
            const out = {};
            for (const k of Object.keys(base)) out[k] = clone(base[k]);
            if (isPlain(over)) {
                for (const k of Object.keys(over)) {
                    out[k] = (isPlain(base[k]) && isPlain(over[k])) ? deepMerge(base[k], over[k]) : clone(over[k]);
                }
            }
            return out;
        }

        // Walk a FLAT_TO_NESTED_MAP entry to produce nested config. Each path
        // is an array; the LEAF (last segment) gets assigned the value. Number
        // segments (e.g. ['progressBar','fillColors',0]) create / index into
        // an array; string segments create / index into an object.
        function flatToNested(flatConfig) {
            const nested = {};
            for (const [flatKey, value] of Object.entries(flatConfig || {})) {
                const path = FLAT_TO_NESTED_MAP[flatKey];
                if (!path) continue;   // c-theme / c-spec-sensitivity-reset / unknown -- skip
                let writable = value;
                // c-border-colors special case: v2 stores comma-separated string;
                // overlay expects array of hex strings.
                if (flatKey === 'c-border-colors' && typeof value === 'string') {
                    writable = value.split(',').map(s => s.trim()).filter(Boolean);
                }
                let cursor = nested;
                for (let i = 0; i < path.length - 1; i++) {
                    const seg = path[i];
                    const nextSeg = path[i + 1];
                    if (cursor[seg] == null || typeof cursor[seg] !== 'object') {
                        cursor[seg] = (typeof nextSeg === 'number') ? [] : {};
                    }
                    cursor = cursor[seg];
                }
                cursor[path[path.length - 1]] = writable;
            }
            return nested;
        }

        // Inverse of flatToNested. Iterates FLAT_TO_NESTED_MAP and pulls each
        // path out of the nested config. Missing paths are skipped (overlay
        // may carry keys v2 doesnt expose; they pass through untouched on
        // re-save via deepMerge upstream).
        function getNestedAtPath(obj, path) {
            let cursor = obj;
            for (const seg of path) {
                if (cursor == null) return undefined;
                cursor = cursor[seg];
            }
            return cursor;
        }

        function nestedToFlat(nestedConfig) {
            const flat = {};
            if (!nestedConfig || typeof nestedConfig !== 'object') return flat;
            for (const [flatKey, path] of Object.entries(FLAT_TO_NESTED_MAP)) {
                const val = getNestedAtPath(nestedConfig, path);
                if (val === undefined) continue;
                // c-border-colors special case: server stores array; v2 expects comma-string.
                if (flatKey === 'c-border-colors' && Array.isArray(val)) {
                    flat[flatKey] = val.join(',');
                } else {
                    flat[flatKey] = val;
                }
            }
            return flat;
        }

        // ==========================================================================
        //  Dev sanity helper (preview-MCP-callable from console)
        //  window.__roundTripSelfTest -- verifies flat -> nested -> flat is identity
        //  for a representative sample. Used in STEP 4 smoke.
        // ==========================================================================
        window.__roundTripSelfTest = function (sample) {
            const probe = sample || {
                'c-card-top':        '#ff00ff',
                'c-card-radius':     42,
                'c-master-overall-size': 75,
                'c-master-glow':     false,
                'c-title-color':     'var(--accent-master)',
                'c-prog-f0':         '#112233',
                'c-prog-f1':         '#445566',
                'c-prog-f2':         '#778899',
                'c-border-colors':   '#aabbcc,#ddeeff,#102030',
                'c-font':            'Space Grotesk'
            };
            const nested = flatToNested(probe);
            const round  = nestedToFlat(nested);
            const ok = Object.keys(probe).every(k => {
                if (k === 'c-border-colors') {
                    // comma-string -> array -> comma-string; whitespace normalisation possible
                    return round[k] && round[k].replace(/\s+/g, '') === probe[k].replace(/\s+/g, '');
                }
                return round[k] === probe[k];
            });
            return { probe, nested, round, ok };
        };

        /* ==========================================================================
           8b. THEMES (Stage 7.29 -- apply algorithm + nested-to-flat translator)
           THEME_KEY_MAP maps each nested theme path (e.g. 'card.backgroundTop')
           to the flat SETTINGS_CONFIG c-* DOM ID. applyTheme walks the table,
           reads each leaf via getNestedValue, and writes into State.config.
           Unmapped paths (e.g. progressBar.fillColors, glow.intensity) are
           logged once and skipped -- they have no v2 control yet.

           Sentinel substitution is automatic: the literal string
           'var(--accent-master)' lands in State.config[id]; applyControlValue
           writes it to the per-element CSS var; the overlay's CSS engine
           resolves var() at runtime against --accent-master.
           ========================================================================== */
        const THEME_KEY_MAP = {
            'font':                         'c-font',
            'masters.accentColor':          'c-master-accent-color',
            'card.backgroundTop':           'c-card-top',
            'card.backgroundBottom':        'c-card-bot',
            'card.backgroundAngle':         'c-card-angle',
            'border.colors':                'c-border-colors',
            'glow.color1':                  'c-glow-c1',
            'glow.color2':                  'c-glow-c2',
            'nowPlaying.color':             'c-np-color',
            'nowPlaying.letterSpacing':     'c-np-spacing',
            'bars.color':                   'c-bars-color',
            'title.color':                  'c-title-color',
            'title.fontWeight':             'c-title-weight',
            'title.glowColor':              'c-title-glow-color',
            'title.glowSize':               'c-title-glow-size',
            'artist.color':                 'c-artist-color',
            'artist.glowColor':             'c-artist-glow-color',
            'artist.glowSize':              'c-artist-glow-size',
            'spectrum.color':               'c-spec-color',
            'timestamps.color':             'c-ts-color'
            // Unmapped (intentionally; v2 SETTINGS_CONFIG has no matching ID):
            //   glow.intensity, glow.pulseDuration, glow.enabled,
            //   title.glowEnabled, artist.glowEnabled,
            //   spectrum.colorMode, spectrum.barCount, spectrum.heightMult, spectrum.barRadius,
            //   progressBar.fillColors,
            //   card.borderThickness, border.enabled, border.spinDuration
            // Stage 7.30 swap will re-evaluate which of these need v2 controls.
        };

        function getNestedValue(obj, path) {
            return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
        }

        function applyTheme(themeKey) {
            const theme = THEMES[themeKey];
            if (theme === undefined) {
                console.warn('[Stage 7.29] applyTheme: unknown theme', themeKey);
                return;
            }

            // Remember the selection itself.
            State.config['c-theme'] = themeKey;
            State.isDirty = true;

            // Walk THEME_KEY_MAP and write each mapped leaf into State.config.
            // 'Rainbow (Default)' is the empty object -- skips every path.
            for (const [nestedPath, flatId] of Object.entries(THEME_KEY_MAP)) {
                const value = getNestedValue(theme, nestedPath);
                if (value === undefined) continue;
                // border.colors and similar arrays -> comma-separated for the
                // colorList placeholder text input.
                const writable = Array.isArray(value) ? value.join(',') : value;
                State.config[flatId] = writable;
            }

            // Re-sync the UI to the new State.config, re-apply CSS variables,
            // re-evaluate the master-following badges (sentinel detection
            // depends on the new State.config), and broadcast preview.
            refreshControlValues();
            applyConfig();
            refreshAllMasterBadges();
            previewConfig();
        }

        /* ==========================================================================
           8c. MASTER-FOLLOWING BADGES (Stage 7.29)
           8 accent-following pickers show a "Following master" badge when their
           State.config[id] === 'var(--accent-master)' (the sentinel that lets
           the overlay CSS resolve the value to the current master accent at
           runtime). Click the badge -> unfollowMaster writes the resolved
           hex into State.config so the picker becomes independent.

           Badge background is bound to var(--accent-master) via CSS so the
           badge colour live-tracks the master accent without JS work.

           8 IDs verbatim from current customize.html Stage 7.21 STEP 4.
           ========================================================================== */
        const MASTER_FOLLOWING_IDS = [
            'c-np-color',
            'c-bars-color',
            'c-platform-color',
            'c-platform-dot',
            'c-title-color',
            'c-artist-color',
            'c-spec-color',
            'c-ts-color'
        ];

        function updateMasterBadge(id) {
            if (!MASTER_FOLLOWING_IDS.includes(id)) return;
            const row = document.querySelector('[data-control-id="' + id + '"]');
            if (!row) return;
            const grp = row.querySelector('.control-input-group');
            if (!grp) return;
            // State.config[id] may be undefined on first paint (loadConfig
            // hasn't populated it yet in standalone mode). Fall back to the
            // SETTINGS_CONFIG default for that ID so the badge surfaces when
            // the default itself is the sentinel.
            let val = State.config[id];
            if (val === undefined) {
                const cfg = SETTINGS_CONFIG.find(c => c.id === id);
                if (cfg) val = cfg.default;
            }
            const isFollowing = (val === 'var(--accent-master)');
            let badge = grp.querySelector('.master-badge');
            if (isFollowing) {
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'master-badge';
                    badge.textContent = 'Following master';
                    badge.title = 'Click to set an independent color';
                    badge.addEventListener('click', () => unfollowMaster(id));
                    grp.appendChild(badge);
                }
            } else if (badge) {
                badge.remove();
            }
        }

        function unfollowMaster(id) {
            // Resolve the current master accent to a concrete hex; fall back to
            // the SETTINGS_CONFIG default for c-master-accent-color if the CSS
            // var hasn't been written yet (rare; happens at very early init).
            let resolved = '';
            try {
                resolved = getComputedStyle(document.documentElement)
                    .getPropertyValue('--accent-master').trim();
            } catch (e) { /* ignore */ }
            if (!resolved) {
                const masterCfg = SETTINGS_CONFIG.find(c => c.id === 'c-master-accent-color');
                resolved = (masterCfg && masterCfg.default) || '#c060ff';
            }
            State.config[id] = resolved;
            State.isDirty = true;
            // Find the SETTINGS_CONFIG entry so applyControlValue gets the
            // right transform / cssVar / cssTarget for this picker.
            const cfg = SETTINGS_CONFIG.find(c => c.id === id);
            if (cfg) {
                refreshControlValues();
                applyControlValue(cfg, resolved);
            }
            updateMasterBadge(id);
            previewConfig();
        }

        function refreshAllMasterBadges() {
            for (const id of MASTER_FOLLOWING_IDS) updateMasterBadge(id);
        }

        /* ==========================================================================
           8d. SEARCH FILTER (Stage 7.29 -- ported from current customize.html Stage 7.20)
           JARGON_MAP entries kept verbatim. filterControls walks every
           .control-row, matches lowercased query against label / id / jargon
           synonyms, and hides non-matches. Empty supercats are hidden too.
           Ctrl+F keyboard shortcut focuses the search input.
           ========================================================================== */
        const JARGON_MAP = {
            // Card appearance
            'corner roundness': 'border radius rounded curve corners',
            'border thickness': 'border width thick',
            'background gradient angle': 'bg angle gradient direction degree',
            'top background color': 'bg top gradient color colour',
            'bottom background color': 'bg bottom gradient color colour',
            'blur behind the card': 'background blur backdrop frosted',
            'card transparency': 'background opacity see through alpha',
            // Audio bars (Spectrum)
            'keep bars at a consistent height': 'auto volume match autogain compression normalize',
            'make quiet sounds louder': 'loudness boost autogain compression normalize',
            'what color the bars are': 'color mode bar color colour rainbow gradient solid',
            'mirror the bars': 'mirror symmetric reflection',
            'how round the bar tops are': 'bar roundness corner radius',
            'minimum bar height': 'lowest bar height min floor',
            'maximum bar height': 'tallest bar height max ceiling',
            'reaction time': 'reaction speed reactivity response ms milliseconds smoothing how quickly bars react to music',
            'animation frame rate': 'frame rate fps refresh advanced',
            // Track and artist
            'title size': 'font size title px',
            'title boldness': 'font weight bold heavy title',
            'title color': 'color colour title hex',
            'how fast title scrolls': 'marquee speed scroll title',
            'title scroll pause': 'marquee pause title delay',
            'title letter spacing': 'letter spacing kerning title tracking',
            'artist size': 'font size artist px',
            'artist boldness': 'font weight bold heavy artist',
            'artist color': 'color colour artist hex',
            'how fast artist scrolls': 'marquee speed scroll artist',
            'artist scroll pause': 'marquee pause artist delay',
            'artist letter spacing': 'letter spacing kerning artist tracking',
            // Glow + Text glow
            'how strong the glow is': 'glow size intensity blur strength px',
            'glow color': 'glow color colour hex',
            // Slide-in animation
            'how long the slide-in takes': 'slide in animation duration ms milliseconds time',
            'how far the card slides in': 'slide distance offset px',
            // Now Playing
            'what the label says': 'now playing label text custom',
            'label color': 'now playing color colour hex',
            'space between letters': 'letter spacing kerning tracking now playing',
            // General
            'overall transparency': 'opacity see through alpha global',
            // Misc
            'how thick the spinning border ring is': 'border thickness spinning ring px',
            'how fast it spins': 'spin duration speed border seconds',
            'how strong the pulse is': 'glow intensity strength pulse',
            'how fast it pulses': 'pulse duration speed glow seconds'
        };

        function filterControls(query) {
            const q = (query || '').trim().toLowerCase();
            const rows = document.querySelectorAll('.control-row');
            const supercats = document.querySelectorAll('.supercat');

            if (!q) {
                rows.forEach(r => { r.hidden = false; });
                // Clearing the search returns to the default clean state: every
                // category visible but COLLAPSED (matches the every-open all-closed
                // rule), which also re-collapses any category that was auto-expanded
                // to show search results below.
                supercats.forEach(sc => { sc.hidden = false; sc.classList.add('collapsed'); });
                return;
            }

            rows.forEach(row => {
                const id = (row.dataset.controlId || '').toLowerCase();
                const labelEl = row.querySelector('.control-label');
                const label = (labelEl ? labelEl.textContent : '').toLowerCase();
                const jargon = (JARGON_MAP[label] || '').toLowerCase();
                const match = label.includes(q) || id.includes(q) || (jargon && jargon.includes(q));
                row.hidden = !match;
            });

            // Hide a supercat entirely when none of its rows survived the filter,
            // and AUTO-EXPAND the ones that still have matches. Categories default to
            // collapsed (their body is display:none), so without uncollapsing here the
            // matching rows would stay invisible inside a closed category.
            supercats.forEach(sc => {
                const visible = sc.querySelectorAll('.control-row:not([hidden])').length;
                sc.hidden = visible === 0;
                if (visible > 0) { sc.classList.remove('collapsed'); }
                else { sc.classList.add('collapsed'); }
            });
        }

        /* ==========================================================================
           8e. SUPERCAT COLLAPSE (Stage 7.29 -- ported from current customize.html
           Stage 7.21). Each .supercat-header click toggles .collapsed on the
           parent .supercat container; CSS handles the visual transition.

           localStorage key per supercat: supercat_<id>_collapsed ('0' / '1').
           Behavior (operator request, every-open all-collapsed): EVERY open starts
           with ALL categories COLLAPSED -- the clean, fully-closed sidebar is
           guaranteed every time anyone opens the customizer. The initial state
           ignores any stored value, so a category the user expanded last time is
           collapsed again on the next open. Clicking a header still toggles it
           (and records '0'/'1') for the current view.
           ========================================================================== */
        function initSupercatCollapse() {
            document.querySelectorAll('.supercat-header').forEach(header => {
                const key = header.dataset.supercat;
                if (!key) return;
                const supercat = header.closest('.supercat');
                if (!supercat) return;
                const lsKey = 'supercat_' + key + '_collapsed';

                // Operator request (every-open all-collapsed): ALWAYS start every
                // category collapsed on open, regardless of any saved state. This
                // guarantees the fully-closed sidebar every time anyone opens the
                // customizer; the prior per-category localStorage expansion state is
                // intentionally NOT restored here. The click handler below still
                // toggles the category + records '0'/'1' for the current view.
                supercat.classList.add('collapsed');

                header.addEventListener('click', () => {
                    supercat.classList.toggle('collapsed');
                    const collapsed = supercat.classList.contains('collapsed');
                    try { localStorage.setItem(lsKey, collapsed ? '1' : '0'); }
                    catch (e) { /* localStorage unavailable */ }
                });
            });
        }

        /* ==========================================================================
           8f. SHOW ADVANCED TOGGLE -- REMOVED (operator request, post 7.30.5).
           initAdvancedToggle() + the checkbox + the gating CSS were removed; all
           controls + the Layout supercat are always visible (no body.show-advanced
           class, no localStorage 'customize_show_advanced').
           ========================================================================== */

        let _searchDebounceTimer = null;

        function initSearchFilter() {
            const $input = document.getElementById('settings-search');
            const $clear = document.getElementById('settings-search-clear');
            if (!$input) return;

            $input.addEventListener('input', () => {
                clearTimeout(_searchDebounceTimer);
                _searchDebounceTimer = setTimeout(() => filterControls($input.value), 80);
                if ($clear) $clear.hidden = !$input.value;
            });

            if ($clear) {
                $clear.addEventListener('click', () => {
                    $input.value = '';
                    filterControls('');
                    $clear.hidden = true;
                    $input.focus();
                });
            }

            // Ctrl+F focuses the search input (and Esc clears + blurs).
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && (e.key === 'f' || e.key === 'F')) {
                    e.preventDefault();
                    $input.focus();
                    $input.select();
                } else if (e.key === 'Escape' && document.activeElement === $input) {
                    if ($input.value) {
                        $input.value = '';
                        filterControls('');
                        if ($clear) $clear.hidden = true;
                    } else {
                        $input.blur();
                    }
                }
            });
        }

        /* ==========================================================================
           9. TOP BAR ACTIONS (Apply to OBS / Reset to Defaults / Preset Manager)
           ========================================================================== */

        async function onApplyToOBS() {
            const $btn = document.getElementById('btn-apply-obs');
            if (!$btn) return;

            $btn.disabled = true;
            const originalText = $btn.textContent;
            $btn.textContent = 'Saving...';

            const ok = await saveConfig();

            $btn.textContent = ok ? 'Applied' : 'Failed';
            setTimeout(() => {
                $btn.textContent = originalText;
                $btn.disabled = false;
            }, 1500);
        }

        async function onResetDefaults() {
            if (!confirm('Reset all settings to defaults? This cannot be undone.')) return;

            // Stage 7.28: data-driven reset. Populate State.config with every
            // entry's config.default value (skipping undefined defaults), then
            // sync the DOM via refreshControlValues + re-apply the CSS layer
            // via applyConfig. Client-side only -- matches current customize.html
            // behavior (no /reset-overlay-config endpoint exists). User must
            // click Apply to OBS to persist the reset.
            State.config = {};
            for (const cfg of SETTINGS_CONFIG) {
                if (cfg.default !== undefined) {
                    State.config[cfg.id] = cfg.default;
                }
            }
            State.isDirty = true;

            refreshControlValues();
            applyConfig();
            // Stage 7.29: reset returns the 8 accent-following pickers back to
            // the 'var(--accent-master)' sentinel default -> the badge should
            // re-appear on every one of them.
            refreshAllMasterBadges();
            previewConfig();

            // Reload iframe to flush any per-element CSS vars from the previous
            // session (only the entries currently in SETTINGS_CONFIG were
            // restored by refreshControlValues -- iframe reload is the safety
            // net for any stale vars set by code paths outside SETTINGS_CONFIG).
            const $iframe = document.getElementById('preview-iframe');
            if ($iframe && isProductionContext()) {
                try { $iframe.contentWindow.location.reload(); }
                catch (e) { /* cross-origin or no src */ }
            }
        }

        /* ==========================================================================
           9b. PRESET MANAGER (Stage 7.30.4 Item 1 -- legacy V1 feature port)
           Server endpoints + EXACT contract sourced verbatim from legacy
           customize_legacy.html (Stage 7.30.4 SE5 strike 1/3 research):
             GET    /list-presets                  -> array of names (line 4555)
             POST   /save-preset {name,config}     -> persists nested; resp {saved} (line 4734)
             GET    /load-preset?name=<encoded>    -> returns saved nested config (line 4590)
             DELETE /delete-preset?name=<encoded>  -> removes named preset (line 4823)
           Overwrite = POST /save-preset with an existing name (legacy pmOverwrite, line 4772).
           All require isProductionContext() (Stage 7.30 SE5 origin gate);
           standalone mode shows offline status.

           Legacy ALSO had Export (download .json) + Import (upload .json) --
           DEFERRED this cycle pending operator decision (reported at gate).
           ========================================================================== */
        function pmStatus(msg, ok) {
            const $s = document.getElementById('preset-status');
            if (!$s) return;
            $s.textContent = msg;
            $s.hidden = !msg;
            $s.style.color = ok === false ? '#dc2626' : 'var(--c-accent)';
        }

        // Stage 7.30.4 SE5 strike 1/3: cache of current preset names, refreshed
        // by renderPresetList. savePreset reads it to detect a name collision
        // and confirm an overwrite (legacy pmOverwrite behavior).
        let _presetNames = [];

        async function renderPresetList() {
            const $ul = document.querySelector('#preset-modal .preset-list');
            if (!$ul) return;
            $ul.innerHTML = '';
            if (!isProductionContext()) {
                $ul.innerHTML = '<li class="preset-empty">Preset list unavailable in standalone testing.</li>';
                return;
            }
            try {
                const r = await fetch('/list-presets');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const names = await r.json();
                _presetNames = Array.isArray(names) ? names.slice() : [];
                if (!Array.isArray(names) || names.length === 0) {
                    $ul.innerHTML = '<li class="preset-empty">No saved presets yet. Adjust controls and save below.</li>';
                    return;
                }
                for (const name of names) {
                    const $li = document.createElement('li');
                    $li.className = 'preset-item';
                    const $nameSpan = document.createElement('span');
                    $nameSpan.className = 'preset-name';
                    $nameSpan.textContent = name;
                    const $load = document.createElement('button');
                    $load.type = 'button';
                    $load.className = 'btn btn-primary';
                    $load.textContent = 'Load';
                    $load.addEventListener('click', () => loadPreset(name));
                    const $del = document.createElement('button');
                    $del.type = 'button';
                    $del.className = 'btn btn-danger-ghost';
                    $del.textContent = 'Delete';
                    $del.addEventListener('click', () => deletePreset(name));
                    $li.appendChild($nameSpan);
                    $li.appendChild($load);
                    $li.appendChild($del);
                    $ul.appendChild($li);
                }
            } catch (e) {
                $ul.innerHTML = '<li class="preset-empty">Failed to load presets: ' + (e.message || e) + '</li>';
            }
        }

        async function loadPreset(name) {
            if (!isProductionContext()) { pmStatus('Standalone testing -- cannot reach server.', false); return; }
            try {
                // Stage 7.30.4 SE5 strike 1/3: legacy contract is GET with a
                // name query param (customize_legacy.html line 4590), NOT POST.
                // POST returned 405 Method Not Allowed from server.js.
                const r = await fetch('/load-preset?name=' + encodeURIComponent(name));
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const nested = await r.json();
                State.config = nestedToFlat(nested || {});
                State.isDirty = true;
                refreshControlValues();
                applyConfig();
                if (typeof refreshAllMasterBadges === 'function') refreshAllMasterBadges();
                previewConfig();
                pmStatus('Loaded "' + name + '" -- click Apply to OBS to persist.', true);
            } catch (e) {
                pmStatus('Load failed: ' + (e.message || e), false);
            }
        }

        async function savePreset() {
            const $input = document.getElementById('preset-name-input');
            if (!$input) return;
            const name = ($input.value || '').trim();
            if (!name) { pmStatus('Enter a name first.', false); return; }
            if (!isProductionContext()) { pmStatus('Standalone testing -- cannot reach server.', false); return; }
            // Stage 7.30.4 SE5 strike 1/3: OVERWRITE behavior (legacy pmOverwrite).
            // If the name already exists, confirm before clobbering it. POST to
            // /save-preset with an existing name overwrites server-side (verified
            // in legacy customize_legacy.html line 4772 pmOverwrite -- same
            // endpoint + body, no separate route).
            const isOverwrite = _presetNames.indexOf(name) !== -1;
            if (isOverwrite && !confirm('Preset "' + name + '" already exists. Overwrite it with the current settings?')) {
                return;
            }
            try {
                const nested = flatToNested(State.config);
                const r = await fetch('/save-preset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, config: nested })
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                pmStatus(isOverwrite ? 'Updated "' + name + '" with current settings.' : 'Saved "' + name + '".', true);
                $input.value = '';
                renderPresetList();
            } catch (e) {
                pmStatus('Save failed: ' + (e.message || e), false);
            }
        }

        async function deletePreset(name) {
            if (!confirm('Delete preset "' + name + '"? This cannot be undone.')) return;
            if (!isProductionContext()) { pmStatus('Standalone testing -- cannot reach server.', false); return; }
            try {
                // Stage 7.30.4 SE5 strike 1/3: legacy contract is the DELETE
                // method with a name query param (customize_legacy.html line
                // 4823), NOT POST. POST returned 405 Method Not Allowed.
                const r = await fetch('/delete-preset?name=' + encodeURIComponent(name), { method: 'DELETE' });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                pmStatus('Deleted "' + name + '".', true);
                renderPresetList();
            } catch (e) {
                pmStatus('Delete failed: ' + (e.message || e), false);
            }
        }

        // Stage 7.30.5 Item 1: export the CURRENT live config as a .json download.
        // Mirrors the legacy pmExport envelope (customize_legacy.html line 5068)
        // but serializes State.config (current settings) instead of a saved preset
        // by name -- per the operator /goal v2-adaptation spec. Pure client-side
        // (no server call) so it also works in standalone testing.
        function exportPreset() {
            try {
                const presetName = 'overlay-config';
                // Stage 7.32: export the FULL config -- current control values
                // (flatToNested) deep-merged ON TOP of the nested passthrough
                // (State.nested) -> layout.canvas/nodes geometry + every unmapped
                // key are included. Matches V1's envelope (full config), so a
                // new-panel export round-trips losslessly AND stays interchangeable
                // with a friend's V1/v12 export.
                const nested = deepMerge(State.nested, flatToNested(State.config));
                const envelope = {
                    format:       'mastersfm.preset',
                    version:      1,
                    name:         presetName,
                    exportedAt:   new Date().toISOString(),
                    exportedFrom: 'v14.0.0',
                    config:       nested
                };
                const safeName = presetName.replace(/[^a-zA-Z0-9 _\-]/g, '').trim() || 'preset';
                const filename = 'MastersFM_' + safeName + '.json';
                const blob = new Blob([JSON.stringify(envelope, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 0);
                pmStatus('Exported current settings to ' + filename + '.', true);
            } catch (e) {
                pmStatus('Export failed: ' + (e.message || e), false);
            }
        }

        // Stage 7.30.5 Item 2: import a preset from an uploaded .json file.
        // Forgiving detection (mirrors legacy pmImport, customize_legacy.html line
        // 5099): accepts either the Export envelope {format:'mastersfm.preset',
        // config:{...}} OR a bare nested config object. Validation
        // (isValidPresetShape) is MANDATORY and runs BEFORE any State.config
        // mutation -- malformed / wrong-shape / empty input is rejected with a
        // friendly message and ZERO state change. On a valid import we apply
        // directly (operator /goal spec): nestedToFlat -> MERGE into State.config
        // -> applyConfig + refreshControlValues (mirrors loadPreset's apply path;
        // merge so a partial preset doesn't blank unset controls -- nestedToFlat
        // skips paths absent from the import).
        function isValidPresetShape(obj) {
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return false;
            const keys = Object.keys(obj);
            if (keys.length === 0) return false;
            const validTopKeys = new Set(Object.values(FLAT_TO_NESTED_MAP).map(p => p[0]));
            return keys.some(k => validTopKeys.has(k));
        }

        function importPreset() {
            const input = document.getElementById('preset-import-input');
            if (!input) return;
            input.value = '';   // reset so re-importing the SAME file still fires change
            input.click();
        }

        function handleImportFile(event) {
            const file = event.target && event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onerror = () => pmStatus('Import failed: could not read the file.', false);
            reader.onload = () => {
                let parsed;
                try {
                    parsed = JSON.parse(reader.result);
                } catch (err) {
                    pmStatus('Import failed: file is not valid JSON.', false);
                    return;   // NO state change
                }
                // Forgiving detection: Export envelope OR bare config object.
                let candidate = null;
                if (parsed && typeof parsed === 'object' && parsed.format === 'mastersfm.preset' && parsed.config) {
                    candidate = parsed.config;
                } else if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
                    candidate = parsed;
                }
                if (!isValidPresetShape(candidate)) {
                    pmStatus('Import failed: this does not look like a Master\'s FM preset.', false);
                    return;   // NO state change
                }
                // Valid -- apply directly (mirrors loadPreset). MERGE so keys the
                // import omits keep their current values.
                try {
                    // Stage 7.32: fold the FULL imported nested config into the
                    // passthrough FIRST -> captures layout.canvas/nodes geometry +
                    // any key the flat model doesn't expose (the lossless-layout
                    // fix; this is what a friend's V1/v12 export carries). THEN
                    // update the flat controls the panel renders. saveConfig /
                    // previewConfig now emit deepMerge(State.nested, flat) so the
                    // overlay receives the imported layout, not just the flats.
                    State.nested = deepMerge(State.nested, candidate);
                    State.config = Object.assign({}, State.config, nestedToFlat(candidate));
                    State.isDirty = true;
                    refreshControlValues();
                    applyConfig();
                    if (typeof refreshAllMasterBadges === 'function') refreshAllMasterBadges();
                    previewConfig();
                    pmStatus('Imported and applied -- click Apply to OBS to persist.', true);
                } catch (err) {
                    pmStatus('Import failed while applying: ' + (err.message || err), false);
                }
            };
            reader.readAsText(file);
        }

        function openPresetManager() {
            const $m = document.getElementById('preset-modal');
            if (!$m) return;
            $m.hidden = false;
            pmStatus('', true);
            renderPresetList();
        }

        function closePresetManager() {
            const $m = document.getElementById('preset-modal');
            if (!$m) return;
            $m.hidden = true;
        }

        // Stage 7.30.4 Item 1: replace v14.1.0 alert stub with real modal.
        function onPresetManager() {
            openPresetManager();
        }

        /* ==========================================================================
           9b. PREVIEW SCALING (Stage 7.32 -- ports V1's scaleIframe)
           The preview renders a FIXED 1000x200 overlay (Master's FM standard OBS
           source size). scalePreview() scales it via transform:scale to fit the
           preview pane, capped at 1.0 so the preview never balloons when the
           window is maximized/resized (operator gate FAIL: "scales with the window
           which is bad"). Re-run on window resize + after the iframe loads.
           ========================================================================== */
        const PREVIEW_W = 1000, PREVIEW_H = 200;
        function scalePreview() {
            const frame  = document.getElementById('preview-frame');
            const stage  = document.getElementById('preview-stage');
            const iframe = document.getElementById('preview-iframe');
            if (!frame || !stage || !iframe) return;
            const cs = getComputedStyle(frame);
            const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
            const padY = (parseFloat(cs.paddingTop)  || 0) + (parseFloat(cs.paddingBottom) || 0);
            const avW = Math.max(120, frame.clientWidth  - padX);
            const avH = Math.max(40,  frame.clientHeight - padY);
            const sc  = Math.min(avW / PREVIEW_W, avH / PREVIEW_H, 1.0);
            iframe.style.setProperty('--preview-scale', sc);
            stage.style.width  = Math.round(PREVIEW_W * sc) + 'px';
            stage.style.height = Math.round(PREVIEW_H * sc) + 'px';
        }

        /* ==========================================================================
           10. INIT
           Cache elements, wire top bar buttons, wait for iframe to load, then
           load config from server, apply CSS variables, and attach control
           bindings. Order matters: bindings restore their initial state from
           State.config which is only populated after loadConfig().
           ========================================================================== */
        function init() {
            cacheElements();

            // Wire top bar buttons (independent of iframe / config)
            const $btnApply = document.getElementById('btn-apply-obs');
            const $btnReset = document.getElementById('btn-reset-defaults');
            const $btnPreset = document.getElementById('btn-preset-manager');
            if ($btnApply) $btnApply.addEventListener('click', onApplyToOBS);
            if ($btnReset) $btnReset.addEventListener('click', onResetDefaults);
            if ($btnPreset) $btnPreset.addEventListener('click', onPresetManager);

            // SE5 FIX: iframe src is set lazily here to avoid the directory-
            // listing trap when standalone-HTTP-served (e.g. Python static
            // server returns directory listings for `/`). On real server.js
            // origin: src = '/?preview=1' (canonical preview route). On any
            // other origin: srcdoc placeholder explains the limitation.
            const $iframe = document.getElementById('preview-iframe');
            if ($iframe) {
                if (isProductionContext()) {
                    $iframe.src = '/?preview=1';
                } else {
                    $iframe.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><title>Standalone</title></head><body style="background:#1a1a1a;color:#808080;font-family:system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px;line-height:1.5;"><div><strong style="color:#c0c0c0;display:block;margin-bottom:8px;">Preview unavailable in standalone testing</strong>The live overlay preview needs Master&rsquo;s FM server.js (port 4242) at the canonical /customize route. Stage 7.30 swap will put this file there; the preview will then load automatically.</div></body></html>';
                }
            }

            // Stage 7.28: render all 141 controls into supercat bodies BEFORE
            // the iframe-load bootstrap binds them. Rendering is synchronous +
            // independent of the iframe; it can happen as soon as init() runs.
            renderAllControls();

            // Stage 7.32: size the preview to a faithful 1000x200 (scaled to fit
            // the pane, capped at 1.0). Re-run on window resize so the preview
            // never balloons/stretches with the window (operator gate FAIL fix).
            scalePreview();
            window.addEventListener('resize', scalePreview);
            setTimeout(scalePreview, 0);

            // Stage 7.29: wire search filter + Ctrl+F shortcut. Filter operates
            // on the rendered .control-row elements, so this must come AFTER
            // renderAllControls (but doesn't depend on bindings/state).
            initSearchFilter();

            // Stage 7.29: wire supercat collapse. Operator request (every-open
            // all-collapsed): every category starts collapsed; click a header to open.
            initSupercatCollapse();

            // Stage 7.30.6: wire help-icon tooltip tap-toggle + Esc (delegated).
            initHelpTooltips();

            // Show advanced toggle REMOVED (operator request, post 7.30.5):
            // initAdvancedToggle() call dropped; all controls always visible.

            // Wait for iframe to finish loading before bootstrap.
            const bootstrap = async () => {
                await loadConfig();
                applyConfig();
                initBindings();
                // Stage 7.29: one-shot pass to surface the badges on the 8
                // accent-following pickers after the DOM rows exist (rendered
                // by renderAllControls above) and State.config has been
                // restored (loadConfig populated it).
                refreshAllMasterBadges();
                // Stage 7.32: re-scale once the preview iframe has loaded + layout settled.
                scalePreview();
            };
            if ($iframe) {
                // If iframe already loaded (cached), fire bootstrap immediately;
                // otherwise wait for load event.
                if ($iframe.contentDocument && $iframe.contentDocument.readyState === 'complete') {
                    bootstrap();
                } else {
                    $iframe.addEventListener('load', bootstrap);
                    // Fallback for environments where iframe never loads
                    // (e.g. file:// open with no server): bind without preview.
                    setTimeout(() => {
                        if (!State.isDirty && Object.keys(State.config).length === 0) {
                            // Still empty after 1500ms -> iframe load probably failed.
                            // Run bindings anyway so the UI is interactive.
                            bootstrap();
                        }
                    }, 1500);
                }
            } else {
                // No iframe element (defensive)
                bootstrap();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Stage 7.30.4 Item 1: wire Preset Manager modal close (button + backdrop + Esc)
        document.addEventListener('DOMContentLoaded', () => {
            const $m = document.getElementById('preset-modal');
            if (!$m) return;
            const $close = document.getElementById('preset-modal-close');
            const $saveBtn = document.getElementById('preset-save-btn');
            const $input = document.getElementById('preset-name-input');
            if ($close) $close.addEventListener('click', closePresetManager);
            if ($saveBtn) $saveBtn.addEventListener('click', savePreset);
            // Stage 7.30.5 Item 1: wire Export button (current-config .json download).
            const $exportBtn = document.getElementById('preset-export-btn');
            if ($exportBtn) $exportBtn.addEventListener('click', exportPreset);
            // Stage 7.30.5 Item 2: wire Import button (hidden file input) + change handler.
            const $importBtn = document.getElementById('preset-import-btn');
            const $importInput = document.getElementById('preset-import-input');
            if ($importBtn) $importBtn.addEventListener('click', importPreset);
            if ($importInput) $importInput.addEventListener('change', handleImportFile);
            if ($input) {
                $input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); savePreset(); }
                });
            }
            $m.addEventListener('click', e => {
                // close on backdrop click (not on modal content click)
                if (e.target === $m) closePresetManager();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !$m.hidden) closePresetManager();
            });
        });
    </script>

    <!-- Stage 7.30.4 Item 1: Preset Manager modal markup. Hidden by default;
         openPresetManager() removes [hidden] + populates list via /list-presets. -->
    <div class="preset-modal-backdrop" id="preset-modal" hidden>
        <div class="preset-modal" role="dialog" aria-modal="true" aria-labelledby="preset-modal-title">
            <header class="preset-modal-header">
                <h2 id="preset-modal-title">Preset Manager</h2>
                <button class="preset-modal-close" id="preset-modal-close" type="button" aria-label="Close">×</button>
            </header>
            <ul class="preset-list" role="list"></ul>
            <footer class="preset-modal-footer">
                <input type="text" id="preset-name-input" placeholder="Preset name" maxlength="40" autocomplete="off" />
                <button type="button" id="preset-save-btn" class="btn btn-primary">Save current as</button>
            </footer>
            <!-- Stage 7.30.5: Export (current config) + Import (.json upload) action row. -->
            <div class="preset-modal-actions">
                <button type="button" id="preset-export-btn" class="btn btn-ghost">Export</button>
                <button type="button" id="preset-import-btn" class="btn btn-ghost">Import</button>
                <input type="file" id="preset-import-input" accept=".json,application/json" hidden />
            </div>
            <div class="preset-status" id="preset-status" hidden></div>
        </div>
    </div>
</body>
</html>
